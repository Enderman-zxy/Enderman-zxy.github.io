        <h1 id="OOP-学习笔记"><a href="#OOP-学习笔记" class="headerlink" title="OOP 学习笔记"></a>OOP 学习笔记</h1><p>OOP 即面向对象编程。下面是几个 OOP 的实例。</p>
<span id="more"></span>

<h2 id="温度"><a href="#温度" class="headerlink" title="温度"></a>温度</h2><figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">// Temperature.h</span></span><br><span class="line"><span class="meta">#<span class="keyword">pragma</span> once</span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;iostream&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdexcept&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Temperature</span> &#123;</span><br><span class="line"> <span class="keyword">public</span>:</span><br><span class="line">  <span class="function"><span class="keyword">explicit</span> <span class="title">Temperature</span><span class="params">(<span class="type">const</span> <span class="type">double</span> celsius)</span> : m_celsius(celsius) &#123;</span></span><br><span class="line">    <span class="comment">// 校验温度是否合法，若不合法则抛出异常</span></span><br><span class="line">    <span class="keyword">if</span> (m_celsius &lt; ABSOLUTE_ZERO_CELSIUS) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Temperature cannot be below absolute zero.&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line">  <span class="comment">// 用于读取 private 成员</span></span><br><span class="line">  <span class="function"><span class="type">double</span> <span class="title">getCelsius</span><span class="params">()</span> <span class="type">const</span> </span>&#123; <span class="keyword">return</span> m_celsius; &#125; <span class="comment">// 此处 const 声明这个函数不会改变类内的成员</span></span><br><span class="line"></span><br><span class="line">  <span class="comment">// 计算华氏度</span></span><br><span class="line">  <span class="function"><span class="type">double</span> <span class="title">getFahrenheit</span><span class="params">()</span> <span class="type">const</span> </span>&#123;</span><br><span class="line">    <span class="keyword">return</span> m_celsius * <span class="number">1.8</span> + <span class="number">32.0</span>;</span><br><span class="line">    <span class="comment">// return m_fahrenheit;</span></span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// 重载运算符，用于比较两个温度是否相等</span></span><br><span class="line">  <span class="type">bool</span> <span class="keyword">operator</span>==(<span class="type">const</span> Temperature&amp; other) <span class="type">const</span> &#123;</span><br><span class="line">    <span class="keyword">return</span> m_celsius == other.<span class="built_in">getCelsius</span>();</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="type">bool</span> <span class="keyword">operator</span>&lt;(<span class="type">const</span> Temperature&amp; compare) <span class="type">const</span> &#123;</span><br><span class="line">    <span class="keyword">return</span> m_celsius &lt; compare.<span class="built_in">getCelsius</span>();</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// 设置温度，同样检测温度是否合法</span></span><br><span class="line">  <span class="function"><span class="type">void</span> <span class="title">setCelsius</span><span class="params">(<span class="type">const</span> <span class="type">double</span> celsius)</span> </span>&#123;</span><br><span class="line">    <span class="keyword">if</span> (celsius &lt; ABSOLUTE_ZERO_CELSIUS) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Temperature cannot be below absolute zero.&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">    m_celsius = celsius;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line"> <span class="keyword">private</span>:</span><br><span class="line">  <span class="type">static</span> <span class="keyword">constexpr</span> <span class="type">double</span> ABSOLUTE_ZERO_CELSIUS = <span class="number">-273.15</span>; <span class="comment">// 绝对零度</span></span><br><span class="line">  <span class="type">double</span> m_celsius; <span class="comment">// 放在 private 部分，使其必须使用 setCelsius() 才能修改</span></span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="comment">// 重载 + 运算符</span></span><br><span class="line"><span class="keyword">inline</span> Temperature <span class="keyword">operator</span>+(<span class="type">const</span> Temperature&amp; lhs, <span class="type">const</span> Temperature&amp; rhs) &#123;</span><br><span class="line">  <span class="keyword">return</span> <span class="built_in">Temperature</span>(lhs.<span class="built_in">getCelsius</span>() + rhs.<span class="built_in">getCelsius</span>());</span><br><span class="line">&#125;</span><br><span class="line"><span class="comment">// 重载 &lt;&lt; 运算符</span></span><br><span class="line"><span class="keyword">inline</span> std::ostream&amp; <span class="keyword">operator</span>&lt;&lt;(std::ostream&amp; os, <span class="type">const</span> Temperature&amp; c) &#123;</span><br><span class="line">  <span class="keyword">return</span> os &lt;&lt; c.<span class="built_in">getCelsius</span>() &lt;&lt; <span class="string">&quot; °C&quot;</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

<h2 id="动物园"><a href="#动物园" class="headerlink" title="动物园"></a>动物园</h2><figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">// Animal.h</span></span><br><span class="line"><span class="meta">#<span class="keyword">pragma</span> once</span></span><br><span class="line"></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;string&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;iostream&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;utility&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdexcept&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="comment">//基类 Animal</span></span><br><span class="line"><span class="keyword">class</span> <span class="title class_">Animal</span> &#123;</span><br><span class="line">  <span class="comment">//为了让派生类能够使用 m_name, m_age，且防止被修改，使用protected关键字</span></span><br><span class="line"> <span class="keyword">protected</span>:</span><br><span class="line">  std::string m_name;</span><br><span class="line">  <span class="type">int</span> m_age;</span><br><span class="line"> <span class="keyword">public</span>:</span><br><span class="line">  <span class="built_in">Animal</span>(std::string name, <span class="type">int</span> age) : <span class="built_in">m_name</span>(std::<span class="built_in">move</span>(name)), <span class="built_in">m_age</span>(age) &#123;</span><br><span class="line">    <span class="keyword">if</span> (age &lt; <span class="number">0</span>) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Age cannot be negative&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line">  <span class="comment">// 设置虚函数，在派生类中实现</span></span><br><span class="line">  <span class="function"><span class="keyword">virtual</span> <span class="type">void</span> <span class="title">speak</span><span class="params">()</span> <span class="type">const</span> </span>= <span class="number">0</span>;</span><br><span class="line">  <span class="function"><span class="keyword">virtual</span> <span class="type">void</span> <span class="title">eat</span><span class="params">()</span> <span class="type">const</span> </span>= <span class="number">0</span>;</span><br><span class="line">  <span class="function"><span class="keyword">virtual</span> std::string <span class="title">getType</span><span class="params">()</span> <span class="type">const</span> </span>= <span class="number">0</span>;</span><br><span class="line">  <span class="comment">// 析构函数，用于删除这个对象，如在 vector 中 pop_back()</span></span><br><span class="line">  <span class="keyword">virtual</span> ~<span class="built_in">Animal</span>() = <span class="keyword">default</span>;</span><br><span class="line">  <span class="comment">// 所有派生类的共通逻辑，在基类中实现</span></span><br><span class="line">  <span class="function"><span class="type">void</span> <span class="title">info</span><span class="params">()</span> <span class="type">const</span> </span>&#123;</span><br><span class="line">    std::cout &lt;&lt; m_name &lt;&lt; <span class="string">&quot; &quot;</span> &lt;&lt; m_age &lt;&lt; std::endl;</span><br><span class="line">  &#125;</span><br><span class="line">  <span class="function"><span class="type">const</span> std::string&amp; <span class="title">getName</span><span class="params">()</span> <span class="type">const</span> </span>&#123; <span class="keyword">return</span> m_name; &#125;</span><br><span class="line">  <span class="function"><span class="type">int</span> <span class="title">getAge</span><span class="params">()</span> <span class="type">const</span> </span>&#123; <span class="keyword">return</span> m_age; &#125;</span><br><span class="line"></span><br><span class="line">&#125;;</span><br></pre></td></tr></table></figure>

<span class="line">  <span class="function"><span class="type">const</span> <span class="type">double</span>&amp; <span class="title">at</span><span class="params">(<span class="type">size_t</span> r, <span class="type">size_t</span> c)</span> <span class="type">const</span> </span>&#123;</span><br><span class="line">    <span class="keyword">if</span> (r &gt;= m_rows || c &gt;= m_cols) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">out_of_range</span>(<span class="string">&quot;Matrix index out of range&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> m_data[r * m_cols + c];</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="function"><span class="type">size_t</span> <span class="title">getRows</span><span class="params">()</span> <span class="type">const</span> </span>&#123; <span class="keyword">return</span> m_rows; &#125;</span><br><span class="line"></span><br><span class="line">  <span class="function"><span class="type">size_t</span> <span class="title">getCols</span><span class="params">()</span> <span class="type">const</span> </span>&#123; <span class="keyword">return</span> m_cols; &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// 重载运算符+，进行矩阵加法</span></span><br><span class="line">  Matrix <span class="keyword">operator</span>+(<span class="type">const</span> Matrix&amp; other) <span class="type">const</span> &#123;</span><br><span class="line">    <span class="comment">// 检查维度是否匹配</span></span><br><span class="line">    <span class="keyword">if</span> (!(m_cols == other.m_cols &amp;&amp; m_rows == other.m_rows)) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Dimension mismatch&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="function">Matrix <span class="title">res</span><span class="params">(m_rows, m_cols)</span></span>;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">size_t</span> i = <span class="number">0</span>; i &lt; m_cols * m_rows; i++) &#123;</span><br><span class="line">      res.m_data[i] = m_data[i] + other.m_data[i];</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> res;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// 矩阵乘法</span></span><br><span class="line">  Matrix <span class="keyword">operator</span>*(<span class="type">const</span> Matrix&amp; other) <span class="type">const</span> &#123;</span><br><span class="line">    <span class="keyword">if</span> (!(m_cols == other.<span class="built_in">getRows</span>())) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Dimension mismatch&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="type">double</span> sum = <span class="number">0</span>;</span><br><span class="line">    <span class="function">Matrix <span class="title">res</span><span class="params">(m_rows, other.m_cols)</span></span>;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">size_t</span> i = <span class="number">0</span>; i &lt; m_rows; i++) &#123;</span><br><span class="line">      <span class="keyword">for</span> (<span class="type">size_t</span> j = <span class="number">0</span>; j &lt; other.<span class="built_in">getCols</span>(); j++) &#123;</span><br><span class="line">        sum = <span class="number">0</span>;</span><br><span class="line">        <span class="keyword">for</span> (<span class="type">size_t</span> k = <span class="number">0</span>; k &lt; m_cols; k++) &#123;</span><br><span class="line">          sum += (<span class="keyword">this</span>-&gt;<span class="built_in">at</span>(i, k)) * (other.<span class="built_in">at</span>(k, j));</span><br><span class="line">        &#125;</span><br><span class="line">        res.<span class="built_in">at</span>(i, j) = sum;</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> res;</span><br><span class="line">  &#125;</span><br><span class="line">  </span><br><span class="line">  <span class="comment">// 矩阵标量乘法</span></span><br><span class="line">  Matrix <span class="keyword">operator</span>*(<span class="type">double</span> scalar) <span class="type">const</span> &#123;</span><br><span class="line">    <span class="function">Matrix <span class="title">res</span><span class="params">(m_rows, m_cols)</span></span>;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">size_t</span> i = <span class="number">0</span>; i &lt; m_rows * m_cols; i++) &#123;</span><br><span class="line">      res.m_data[i] = m_data[i] * scalar;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> res;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line"> <span class="keyword">private</span>:</span><br><span class="line">  std::<span class="type">size_t</span> m_rows;</span><br><span class="line">  std::<span class="type">size_t</span> m_cols;</span><br><span class="line">  std::vector&lt;<span class="type">double</span>&gt; m_data;</span><br><span class="line">  <span class="function"><span class="type">static</span> <span class="type">size_t</span> <span class="title">validate</span><span class="params">(<span class="type">size_t</span> v)</span> </span>&#123;</span><br><span class="line">    <span class="keyword">if</span> (v == <span class="number">0</span>) &#123;</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Rows or cols must be positive&quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> v;</span><br><span class="line">  &#125;</span><br><span class="line">  <span class="function"><span class="type">static</span> <span class="type">void</span> <span class="title">checkSize</span><span class="params">(<span class="type">size_t</span> rows, <span class="type">size_t</span> cols)</span> </span>&#123;</span><br><span class="line">    <span class="keyword">if</span> (rows == <span class="number">0</span> || cols == <span class="number">0</span>)</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">invalid_argument</span>(<span class="string">&quot;Rows or cols must be positive&quot;</span>);</span><br><span class="line">    <span class="keyword">if</span> (rows &gt; std::numeric_limits&lt;<span class="type">size_t</span>&gt;::<span class="built_in">max</span>() / cols)</span><br><span class="line">      <span class="keyword">throw</span> std::<span class="built_in">overflow_error</span>(<span class="string">&quot;Matrix size too large&quot;</span>);</span><br><span class="line">  &#125;</span><br><span class="line">&#125;;</span><br><span class="line"></span><br><span class="line"><span class="comment">// 重载运算符，打印矩阵</span></span><br><span class="line"><span class="keyword">inline</span> std::ostream&amp; <span class="keyword">operator</span>&lt;&lt;(std::ostream&amp; os, <span class="type">const</span> Matrix&amp; t) &#123;</span><br><span class="line">  <span class="keyword">for</span> (<span class="type">size_t</span> i = <span class="number">0</span>; i &lt; t.<span class="built_in">getRows</span>(); i++) &#123;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">size_t</span> j = <span class="number">0</span>; j &lt; t.<span class="built_in">getCols</span>(); j++) &#123;</span><br><span class="line">      os &lt;&lt; t.<span class="built_in">at</span>(i, j) &lt;&lt; <span class="string">&quot; &quot;</span>;</span><br><span class="line">    &#125;</span><br><span class="line">    os &lt;&lt; <span class="string">&quot;\n&quot;</span>;</span><br><span class="line">  &#125;</span><br><span class="line">  <span class="keyword">return</span> os;</span><br><span class="line">&#125;</span><br><span class="line"><span class="comment">// 矩阵的标量乘法满足交换律，上面只实现了矩阵*实数，这个用来实现实数*矩阵</span></span><br><span class="line"><span class="keyword">inline</span> Matrix <span class="keyword">operator</span>*(<span class="type">double</span> scalar, <span class="type">const</span> Matrix&amp; m) &#123; <span class="keyword">return</span> m * scalar; &#125;</span><br></pre></td></tr></table></figure>
